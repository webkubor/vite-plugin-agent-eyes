name: Publish

# 推 v* tag 时自动发 npm。与 compat.yml 的关系：CI 每次 push 都跑校验，
# 这里在发布前再跑一遍同样的三件套 —— 发布是最后一道门，不依赖
# 「之前某次 CI 应该跑过了」这种假设。
#
# 2026-10-08：本文件原先**已经存在**（9f12793 / 589b1e0），不是缺文件。
# 本次只补它缺的三样（见下面各步骤注释），**没有**改鉴权方式。
#
# 曾经试过换成 npm Trusted Publishing（OIDC，`id-token: write` + 不传
# NODE_AUTH_TOKEN），tag v0.15.1 实测失败：
#   npm error code E404
#   npm error 404 Not Found - PUT https://registry.npmjs.org/vite-plugin-agent-eyes
# E404 的含义是「npmjs.com 上没给这个包配 trusted publisher」，不是权限不够。
# 那次切换把一条本来能用的路换成了不能用的路，已改回。
# 升级前提（需要网页 + 2FA，agent 做不了）：npmjs.com → 包 →
# Trusted Publisher → 仓库 webkubor/vite-plugin-agent-eyes、
# workflow 文件名 publish.yml。配好之后再把下面 publish 那步的
# `env:` 删掉、permissions 里加 `id-token: write` 即可。
#
# 2026-10-08 实测：**当前 CI 发不出去**，卡在 npm 侧鉴权，不在本文件。
#   - npm 上该包唯一 owner 是公司账号 `kubor`，个人号 `webkubor` 不是 owner
#     （`npm owner ls vite-plugin-agent-eyes`），所以 webkubor 的 token 发版必 404。
#   - 把 secret NPM_TOKEN 换成 kubor 的 token（kyvault: npm/kubor-company-token）后，
#     错误从 E404 变成 E403 ——「能认证、但无权 PUT 这个包」，疑为 Granular Token
#     没勾这个包 / 要求 2FA。本机 `~/.npmrc` 的 webkubor token 同样报 EOTP。
# 解法（需要网页 + 2FA，agent 做不了），三选一：
#   ① npmjs.com 以 kubor 登录 → 生成对 vite-plugin-agent-eyes 有 Read and write、
#     且 Bypass 2FA 的 Granular Token → 覆写 GitHub secret NPM_TOKEN；
#   ② 把 webkubor 加为该包 maintainer（kubor 在网页上操作）；
#   ③ 配 Trusted Publisher（仓库 webkubor/vite-plugin-agent-eyes、workflow publish.yml），
#      然后删掉下面 publish 步的 `env:`、permissions 里加 `id-token: write`。
# 任一完成后：`gh run rerun <失败的 Publish run id>` 即可补发 0.15.1，无需重打 tag。
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # 仓库锁的是 pnpm-lock.yaml，npm 读不了 → 只能 install，不能 ci。
      # --package-lock=false 同 compat.yml：不留一个 npm 自己造的 lockfile 干扰后续。
      - run: npm install --package-lock=false

      - name: typecheck + 单测 + 构建
        run: npm run compat

      # 发版门禁只挂在 `package.json#scripts.prepublishOnly` 上（npm publish
      # 一定执行它），所以本地 / CI 走的是同一条路径、同一个脚本 ——
      # prepublish-gate.mjs + readme-gate.mjs（真源 CortexOS/scripts/release-gate/
      # 下同名脚本，各仓一份拷贝）。这里**不重复写**产物清单校验：
      # 2026-09-26 在同族仓发生过「CI 里另写一份 need 数组，漏了 assets，
      # README 11 张截图从没进 tarball，npm 页面全是坏图而 CI 全绿」。
      # 「多处各拦一道」的实际效果是把判据拆散，删掉之后只剩一份。
      #
      # tag 名必须与 package.json version 一致，防止「tag 是 v0.15.1 发的却是 0.15.0」；
      # 同时探测该版本是否已发过 npm（重推同一 tag 时不报错、不重复发）
      - name: 校验 tag 与版本一致性并探测 npm
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$VER" ]; then
            echo "tag v$TAG 与 package.json version $VER 不一致"; exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if npm view "vite-plugin-agent-eyes@$VER" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "v$VER 已在 npm 上，将跳过 publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        if: steps.ver.outputs.published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
